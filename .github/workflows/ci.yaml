
name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - "**/*.py"
      - "requirements.txt"
      - "pytest.ini"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "static/js/**"
      - "tests/**"
      - "test_js"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python / pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: Run pytest
        run: python -m pytest -v

  javascript-tests:
    name: JavaScript / Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
      
      - name: Run Vitest
        run: npm test
